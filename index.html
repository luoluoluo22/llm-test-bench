<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="个人 AI 提示词工作台">
  <title>AI 工作台</title>
  <link rel="stylesheet" href="./workbench.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand"><span class="brand-icon">✳</span><span>AI 工作台</span></div>
      <details class="settings" id="settings">
        <summary>接口设置</summary>
        <div class="settings-panel">
          <label>API Base URL<input id="baseUrl" type="url" placeholder="https://api.example.com/v1" autocomplete="url"></label>
          <label>API Key<input id="apiKey" type="password" placeholder="输入你的 API Key" autocomplete="off"></label>
          <button id="saveSettings" class="button secondary" type="button">保存接口设置</button>
          <p id="settingsStatus" class="hint" aria-live="polite">API Key 只保存在当前浏览器会话。</p>
        </div>
      </details>
    </header>

    <section class="composer" aria-labelledby="pageTitle">
      <h1 id="pageTitle">想让 AI 做什么？</h1>
      <p class="subtitle">输入提示词，选择模型，直接查看生成结果。</p>

      <div class="model-row">
        <label class="model-select-label" for="modelSelect">模型</label>
        <select id="modelSelect" aria-label="选择模型"></select>
        <button id="manageModels" class="button secondary" type="button">管理模型</button>
      </div>

      <section id="modelManager" class="model-manager" hidden aria-label="模型 ID 管理">
        <div class="manager-title"><strong>模型 ID</strong><span>添加后会保存在当前浏览器</span></div>
        <form id="modelForm" class="add-model-form">
          <input id="newModelId" type="text" placeholder="输入模型 ID，例如 gpt-4.1" autocomplete="off" required>
          <button class="button primary" type="submit">添加模型</button>
        </form>
        <ul id="modelList" class="model-list"></ul>
      </section>

      <label class="prompt-label" for="prompt">提示词</label>
      <textarea id="prompt" rows="7" placeholder="在这里输入提示词……"></textarea>
      <div class="composer-footer">
        <span id="runStatus" class="hint" aria-live="polite">准备就绪</span>
        <button id="generate" class="button primary generate" type="button"><span>生成</span><span aria-hidden="true">↗</span></button>
      </div>
    </section>

    <section class="results-section" aria-labelledby="resultsTitle">
      <div class="results-heading"><h2 id="resultsTitle">生成结果</h2><span id="resultCount" class="hint">暂无结果</span></div>
      <div id="results" class="results">
        <div class="empty-state"><span>✳</span><p>生成的内容会显示在这里</p></div>
      </div>
    </section>
    <footer>个人使用 · 模型请求由浏览器直接发送至你配置的 API</footer>
  </main>
  <script src="./workbench.js" defer></script>
</body>
</html>
